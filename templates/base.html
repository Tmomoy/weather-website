<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071b2e">
  <meta name="description" content="查詢臺灣各縣市今明 36 小時與一週天氣預報。">
  <title>{% block title %}島嶼天氣{% endblock %}</title>
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="skip-link" href="#main-content">跳到主要內容</a>
  <div class="sky" aria-hidden="true"><span></span><span></span><span></span></div>
  <div class="ambient" aria-hidden="true"><i></i><i></i></div>
  <header class="site-header">
    <a class="brand" href="{{ url_for('weather.home') }}" aria-label="島嶼天氣首頁">
      <span class="brand-mark" aria-hidden="true">◐</span>
      <span>島嶼天氣</span>
    </a>
    <div class="header-meta">
      <span class="header-clock" data-clock></span>
      <span class="source-label"><i></i> 氣象資料連線中</span>
    </div>
  </header>
  <main id="main-content">{% block content %}{% endblock %}</main>
  <footer class="site-footer">
    <p>資料來源：中央氣象署開放資料平臺 · 預報僅供日常參考</p>
  </footer>
  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
